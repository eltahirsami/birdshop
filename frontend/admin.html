<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة تحكم المدير</title>
  <link rel="stylesheet" href="style.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<body>

<h1>📊 لوحة تحكم المدير</h1>

<div class="card">
  <h3>📦 إدارة المنتجات</h3>

  <div id="editForm" style="display:none;background:#fff8e1;padding:15px;border:1px solid #e67e22;border-radius:8px;margin-bottom:15px;">
    <h4 style="margin:0 0 10px;">✏️ تعديل المنتج</h4>
    <input type="hidden" id="editId">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <input type="text" id="editName" placeholder="اسم المنتج" style="padding:6px;border:1px solid #ccc;border-radius:4px;">
      <input type="text" id="editCategory" placeholder="التصنيف" style="padding:6px;border:1px solid #ccc;border-radius:4px;">
      <input type="number" id="editPrice" placeholder="سعر البيع" style="padding:6px;border:1px solid #ccc;border-radius:4px;">
      <input type="number" id="editCostPrice" placeholder="سعر الشراء" style="padding:6px;border:1px solid #ccc;border-radius:4px;">
      <input type="number" id="editStock" placeholder="المخزون" style="padding:6px;border:1px solid #ccc;border-radius:4px;">
      <input type="text" id="editBarcode" placeholder="الباركود (اختياري)" style="padding:6px;border:1px solid #ccc;border-radius:4px;">
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button onclick="saveEdit()" style="background:#27ae60;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">💾 حفظ</button>
      <button onclick="cancelEdit()" style="background:#e74c3c;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">❌ إلغاء</button>
      <span id="editMsg" style="color:#c0392b;font-size:13px;"></span>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>الاسم</th>
        <th>التصنيف</th>
        <th>السعر</th>
        <th>المخزون</th>
        <th>تعديل</th>
        <th>حذف</th>
      </tr>
    </thead>
    <tbody id="adminProducts"></tbody>
  </table>
</div>

<div class="card">
    
    <div class="card">
  <h3>📈 مبيعات الأسبوع</h3>
  <canvas id="salesChart"></canvas>
</div>

  <h3>🧾 جميع المبيعات</h3>
  <table>
    <thead>
      <tr>
        <th>المنتج</th>
        <th>الكمية</th>
        <th>الإجمالي</th>
        <th>التاريخ</th>
      </tr>
    </thead>
    <tbody id="adminSales"></tbody>
  </table>
</div>

<script src="admin.js"></script>
</body>
</html>
