<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تفعيل البرنامج - 🧾 Smart POS System</title>
<style>
  body { background:#0a0e1a; color:#e2e8f0; font-family:Tahoma; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .box { background:#111827; border:1px solid #1e3a5f; border-radius:16px; padding:40px; width:460px; text-align:center; }
  h1 { color:#00d4ff; font-size:22px; margin-bottom:8px; }
  .status-msg { font-size:14px; margin-bottom:16px; padding:12px; border-radius:8px; }
  .status-msg.expired  { background:rgba(255,71,87,0.1); border:1px solid rgba(255,71,87,0.3); color:#ff4757; }
  .status-msg.mismatch { background:rgba(255,165,2,0.1); border:1px solid rgba(255,165,2,0.3); color:#ffa502; }
  .status-msg.default  { background:rgba(100,116,139,0.15); border:1px solid rgba(100,116,139,0.3); color:#94a3b8; }
  .expiry-info { font-size:12px; color:#ff4757; margin-bottom:12px; }
  .machine-id { background:#0a0e1a; border:1px solid #1e3a5f; border-radius:8px; padding:12px; font-family:monospace; color:#00ff88; font-size:14px; letter-spacing:1px; margin:16px 0; word-break:break-all; }
  .label { font-size:12px; color:#64748b; margin-bottom:6px; display:block; }
  input { width:100%; padding:12px; background:#0a0e1a; border:1px solid #1e3a5f; border-radius:8px; color:#e2e8f0; font-size:13px; text-align:center; box-sizing:border-box; margin-bottom:12px; outline:none; font-family:Tahoma; }
  input:focus { border-color:#00d4ff; }
  button { width:100%; padding:12px; background:linear-gradient(135deg,#0099cc,#00d4ff); color:#000; border:none; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer; font-family:Tahoma; }
  .msg { margin-top:12px; font-size:13px; padding:10px; border-radius:6px; display:none; }
  .msg.success { background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.3); color:#00ff88; display:block; }
  .msg.error   { background:rgba(255,71,87,0.1);  border:1px solid rgba(255,71,87,0.3);  color:#ff4757;  display:block; }
  hr { border:none; border-top:1px solid #1e3a5f; margin:20px 0; }
  .back-link { color:#64748b; font-size:12px; margin-top:12px; display:block; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="box">
  <h1>🧾 SMART POS SYSTEM</h1>

  <div class="status-msg default" id="statusMsg">جاري التحقق من حالة الترخيص...</div>
  <div class="expiry-info" id="expiryInfo" style="display:none;"></div>

  <hr>

  <!-- Stage 1: Developer login -->
  <div id="loginSection">
    <span class="label">تسجيل الدخول كمطور لتفعيل البرنامج</span>
    <input id="devUsername" placeholder="اسم المستخدم" autocomplete="username" />
    <input id="devPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button onclick="devLogin()">🔐 تسجيل الدخول</button>
  </div>

  <!-- Stage 2: Activation — visible only after developer login -->
  <div id="activateSection" style="display:none;">
    <span class="label">رقم الجهاز</span>
    <div class="machine-id" id="machineId">جاري التحميل...</div>
    <span class="label">تاريخ انتهاء الاشتراك</span>
    <input id="expiryDate" type="date" />
    <button onclick="activateDev()">✅ تفعيل البرنامج</button>
    <span class="back-link" onclick="showLogin()">↩ رجوع</span>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
const REASON_MESSAGES = {
  expired:         { cls: 'expired',  text: '⏰ انتهت صلاحية اشتراكك — تواصل مع المبرمج لتجديد الاشتراك' },
  machine_mismatch:{ cls: 'mismatch', text: '⚠️ هذا الترخيص مرتبط بجهاز مختلف — تواصل مع المبرمج' },
  not_licensed:    { cls: 'default',  text: '🔒 البرنامج غير مفعّل — تواصل مع المبرمج' }
}

let devCredentials = { username: '', password: '' }
let currentMachineId = ''

async function loadStatus() {
  const res = await fetch('/license/status')
  const data = await res.json()
  currentMachineId = data.machineId || ''
  document.getElementById('machineId').innerText = currentMachineId
  document.getElementById('expiryDate').min = new Date().toISOString().slice(0, 10)

  if (data.licensed) { location.href = '/'; return }

  const urlReason = new URLSearchParams(location.search).get('reason') || data.status || 'not_licensed'
  const info = REASON_MESSAGES[urlReason] || REASON_MESSAGES.not_licensed
  const msgEl = document.getElementById('statusMsg')
  msgEl.className = 'status-msg ' + info.cls
  msgEl.innerText = info.text

  if (urlReason === 'expired' && data.expiry) {
    const el = document.getElementById('expiryInfo')
    el.innerText = 'تاريخ انتهاء الاشتراك: ' + data.expiry
    el.style.display = 'block'
  }
}

function showLogin() {
  document.getElementById('loginSection').style.display = 'block'
  document.getElementById('activateSection').style.display = 'none'
  document.getElementById('msg').className = 'msg'
  document.getElementById('msg').innerText = ''
}

async function devLogin() {
  const username = document.getElementById('devUsername').value.trim()
  const password = document.getElementById('devPassword').value
  const msg = document.getElementById('msg')
  if (!username || !password) {
    msg.className = 'msg error'
    msg.innerText = 'أدخل اسم المستخدم وكلمة المرور'
    return
  }
  const res = await fetch('/license/dev-auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  })
  const data = await res.json()
  if (data.success) {
    devCredentials = { username, password }
    document.getElementById('loginSection').style.display = 'none'
    document.getElementById('activateSection').style.display = 'block'
    msg.className = 'msg'
    msg.innerText = ''
  } else {
    msg.className = 'msg error'
    msg.innerText = '❌ ' + (data.message || 'بيانات غير صحيحة')
  }
}

async function activateDev() {
  const expiry = document.getElementById('expiryDate').value
  const msg = document.getElementById('msg')
  if (!expiry) {
    msg.className = 'msg error'
    msg.innerText = 'اختر تاريخ انتهاء الاشتراك'
    return
  }
  const res = await fetch('/license/activate-dev', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: devCredentials.username, password: devCredentials.password, expiry, machineId: currentMachineId })
  })
  const data = await res.json()
  if (data.success) {
    msg.className = 'msg success'
    msg.innerText = '✅ تم التفعيل بنجاح — صالح حتى ' + data.expiry + ' — جاري الانتقال...'
    setTimeout(() => location.href = '/login.html', 2500)
  } else {
    msg.className = 'msg error'
    msg.innerText = '❌ ' + (data.message || 'فشل التفعيل')
    showLogin()
  }
}

loadStatus()
</script>
</body>
</html>
